# NOTE: this file is ONLY used for Docker Compose
# * the Google Cloud production environment uses a memory store instead!

services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    deploy:
      replicas: 1

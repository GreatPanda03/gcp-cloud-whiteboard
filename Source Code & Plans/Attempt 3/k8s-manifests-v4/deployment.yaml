apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whiteboard
  template:
    metadata:
      labels:
        app: whiteboard
    spec:
      containers:
        - name: whiteboard
          image: europe-west2-docker.pkg.dev/co4219-whiteboard-project/my-repo/co4219-group1-whiteboard:3.1.0
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_HOST
              value: "10.80.84.123" # memorystore
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
